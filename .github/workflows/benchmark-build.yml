name: Benchmark APK Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure Android SDK platform 35 is installed
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/OpenWispr-3.12.0-benchmark-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwispr-3.12.0-benchmark-apk
          path: dist/OpenWispr-3.12.0-benchmark-debug.apk
          if-no-files-found: error
